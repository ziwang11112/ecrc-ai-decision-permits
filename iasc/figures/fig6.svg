  <g id="text_10">
   <text style="font-weight: 700; font-size: 9px; font-family: 'Arial'; text-anchor: start" x="11.7" y="18.647719" transform="rotate(-0 11.7 18.647719)">(a) Authorization and recovery boundary</text>
  </g>
  <g id="text_11">
   <text style="font-weight: 700; font-size: 8.6px; font-family: 'Arial'; text-anchor: middle" x="75.816" y="45.323719" transform="rotate(-0 75.816 45.323719)">Client DB: arm</text>
  </g>
  <g id="text_12">
   <text style="font-size: 8px; font-family: 'Arial'" transform="translate(20.751625 63.03825)">Validate permit and reservation</text>
   <text style="font-size: 8px; font-family: 'Arial'" transform="translate(18.241 72.645)">Persist immutable delivery intent</text>
  </g>
  <g id="text_13">
   <text style="font-weight: 700; font-size: 8.6px; font-family: 'Arial'; text-anchor: middle" x="234" y="45.428531" transform="rotate(-0 234 45.428531)">Independent HTTP / sink DB</text>
  </g>
  <g id="text_14">
   <text style="font-size: 8px; font-family: 'Arial'" transform="translate(190.950625 63.13575)">Atomically commit effect</text>
   <text style="font-size: 8px; font-family: 'Arial'" transform="translate(188.63625 72.97275)">and key / payload binding</text>
  </g>
  <g id="text_15">
   <text style="font-weight: 700; font-size: 8.6px; font-family: 'Arial'; text-anchor: middle" x="392.184" y="45.323719" transform="rotate(-0 392.184 45.323719)">Client DB: reconcile</text>
  </g>
  <g id="text_16">
   <text style="font-size: 8px; font-family: 'Arial'" transform="translate(336.499 63.03825)">Receipt + capacity commitment</text>
   <text style="font-size: 8px; font-family: 'Arial'" transform="translate(339.382125 72.73875)">+ completed intent, atomically</text>
  </g>
  <g id="text_17">
   <text style="font-size: 8px; font-family: 'Arial'" transform="translate(20.22975 92.12625)">Authorization linearization point</text>
   <text style="font-size: 8px; font-family: 'Arial'" transform="translate(43.361625 100.413563)">(irrevocable grant)</text>
  </g>
  <g id="text_18">
   <text style="font-size: 8px; font-family: 'Arial'; text-anchor: middle" x="234" y="92.22375" transform="rotate(-0 234 92.22375)">Same key / payload on retry</text>
  </g>
  <g id="text_19">
   <text style="font-size: 8px; font-family: 'Arial'" transform="translate(350.16525 92.12625)">Use the durable service</text>
   <text style="font-size: 8px; font-family: 'Arial'" transform="translate(359.944 100.301438)">acknowledgement</text>
  </g>
  <g id="text_20">
   <text style="font-size: 8.5px; font-family: 'Arial'; text-anchor: middle" x="234" y="118.266031" transform="rotate(-0 234 118.266031)">Outcome unknown: retain reservation; retry the same key and payload.</text>
  </g>
  <g id="text_21">
   <text style="font-weight: 700; font-size: 9px; font-family: 'Arial'; text-anchor: start" x="11.7" y="149.111719" transform="rotate(-0 11.7 149.111719)">(b) Delivery latency</text>
  </g>
  <g id="text_22">
   <text style="font-size: 8px; font-family: 'Arial'" transform="translate(367.848 209.34225)">5 runs per cell</text>
   <text style="font-size: 8px; font-family: 'Arial'" transform="translate(367.848 218.69475)">64 preissued</text>
   <text style="font-size: 8px; font-family: 'Arial'" transform="translate(367.848 228.015187)">actions per run</text>
  </g>
  <g id="text_23">
   <text style="font-size: 8px; font-family: 'Arial'; text-anchor: start" x="11.7" y="278.208" transform="rotate(-0 11.7 278.208)">Points: median of run-level p95; bars: minimum-maximum across five runs.</text>
