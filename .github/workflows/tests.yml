name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - run: python scripts/verify_release.py
      - run: python -B scripts/run_wrapper_qa.py --output artifacts/ci-wrapper-qa
      - run: python -B iasc_model_check/portable_reproduce.py
      - run: python -B -m unittest discover -s scripts/tests -v
